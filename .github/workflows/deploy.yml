# Rebuilds the nflverse data and deploys the static site to GitHub Pages.
# Runs on every push to main, daily (nflverse refreshes its files nightly in
# season) and on demand. A failed data sanity check stops the deploy, so the
# last good site stays up.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # After nflverse's night play-by-play run (00:30 Eastern) and the Tuesday gap in the odds
    # (back by ~06:55 UTC in 2025); off the hour, where GitHub delays scheduled runs most
    # (the 10:00 cron started 5.6 to 10 hours late, Oct 30 to Nov 2).
    - cron: '50 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          pip install -r pipeline/requirements.txt
          npm ci

      - name: Test pipeline
        working-directory: pipeline
        run: python -m pytest -q

      # Finished seasons never change: keep their nflverse files between runs, so each
      # build only downloads the current season. Add the season that just ended once a year.
      - uses: actions/cache@v6
        with:
          path: |
            pipeline/.cache/pbp/play_by_play_202[2-5].parquet
            pipeline/.cache/pbp_participation/pbp_participation_202[2-5].parquet
            pipeline/.cache/ftn_charting/ftn_charting_202[2-5].parquet
          key: nflverse-2022-2025-v1

      - name: Build data
        run: python pipeline/build.py

      - name: Check and test app
        run: |
          npm run check
          npm test

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
